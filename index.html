<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map Coordinate Tool</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Top Bar: Address Search -->
    <header class="bg-white shadow-md p-4 z-10 flex flex-wrap items-center justify-between gap-4">
        <h1 class="text-xl font-bold text-gray-800">Map & Coordinate Toolkit</h1>
        <div class="flex items-center gap-2 flex-1 max-w-xl">
            <input type="text" id="addressSearchInput" placeholder="Search address (e.g., Eiffel Tower, Paris)..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="searchAddress()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Search</button>
        </div>
        <div class="flex items-center gap-2">
            <label class="text-sm font-medium text-gray-600">Format:</label>
            <select id="formatSelect" onchange="toggleFormat()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="decimal">Decimal Degrees (DD)</option>
                <option value="wgs84">WGS84 (DMS)</option>
            </select>
        </div>
    </header>

    <!-- Main Content: Sidebar + Map -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-96 bg-white shadow-lg flex flex-col z-10 overflow-y-auto p-4 gap-6">
            
            <!-- Section: Add Coordinates -->
            <div>
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Add Points</h2>
                <p class="text-xs text-gray-500 mb-2" id="formatHelpText">Enter single or multiple points (Lat, Lon per line):</p>
                <textarea id="coordInput" rows="4" placeholder="e.g., 37.7749, -122.4194&#10;34.0522, -118.2437" class="w-full border border-gray-300 rounded-lg p-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                <button onclick="plotManualCoordinates()" class="w-full mt-2 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition text-sm font-medium">Plot Points / Drop Pins</button>
            </div>

            <hr class="border-gray-200">

            <!-- Section: Read from File -->
            <div>
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Load from File</h2>
                <p class="text-xs text-gray-500 mb-2">Upload .txt or .csv (Lat, Lon per line):</p>
                <input type="file" id="fileInput" accept=".txt,.csv" onchange="handleFileUpload(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <hr class="border-gray-200">

            <!-- Section: Clicked/Active Points Readout -->
            <div class="flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-semibold text-gray-700">Pinned Points</h2>
                    <button onclick="clearAllPins()" class="text-xs text-red-600 hover:underline">Clear All</button>
                </div>
                <div id="pointsList" class="flex-1 border border-gray-200 rounded-lg p-2 overflow-y-auto space-y-2 bg-gray-50 text-sm">
                    <span class="text-gray-400 italic">Click on the map or add coordinates above.</span>
                </div>
            </div>

        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative">
            <div id="map" class="absolute inset-0"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Initialize Map
        const map = L.map('map').setView([32.109333, 34.855499], 11); // Default center (Center District / Israel area or general)

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let markers = [];
        let currentFormat = 'decimal'; // 'decimal' or 'wgs84'

        // Map Click Event to Drop Pin and Display Coordinate
        map.on('click', function(e) {
            addPin(e.latlng.lat, e.latlng.lng, "Pinned from Map");
        });

        function toggleFormat() {
            currentFormat = document.getElementById('formatSelect').value;
            const helpText = document.getElementById('formatHelpText');
            if (currentFormat === 'wgs84') {
                helpText.innerText = "Format: DD° MM' SS.SS\" N/S, DD° MM' SS.SS\" E/W (one per line)";
            } else {
                helpText.innerText = "Enter single or multiple points (Lat, Lon per line):";
            }
            updatePointsSidebar();
        }

        // Convert Decimal to DMS (WGS84 string format)
        function decimalToDMS(lat, lng) {
            function formatDMS(coord, isLat) {
                const absolute = Math.abs(coord);
                const degrees = Math.floor(absolute);
                const minutesNotTruncated = (absolute - degrees) * 60;
                const minutes = Math.floor(minutesNotTruncated);
                const seconds = ((minutesNotTruncated - minutes) * 60).toFixed(2);
                
                let direction = "";
                if (isLat) {
                    direction = coord >= 0 ? "N" : "S";
                } else {
                    direction = coord >= 0 ? "E" : "W";
                }
                return `${degrees}° ${minutes}' ${seconds}" ${direction}`;
            }
            return `${formatDMS(lat, true)}, ${formatDMS(lng, false)}`;
        }

        // Parse coordinate string input supporting both Decimal and DMS formats roughly
        function parseCoordinateLine(line) {
            line = line.trim();
            if (!line) return null;

            // Check if it's decimal (contains numbers, commas, standard signs)
            if (!line.includes('°')) {
                const parts = line.split(/[,;\s]+/);
                if (parts.length >= 2) {
                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);
                    if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
                }
            } else {
                // Basic DMS parser heuristic
                // Example: 40° 26' 46" N, 79° 58' 56" W
                try {
                    // This is a simplified regex-based parser for standard DMS strings
                    const regex = /([0-9.]+)[°\s]+([0-9.]+)?['\s]+([0-9.]+)?["\s]*([NSEW])/gi;
                    let matches = [...line.matchAll(regex)];
                    if (matches.length >= 2) {
                        let latVal = parseFloat(matches[0][1]) + (matches[0][2] ? parseFloat(matches[0][2])/60 : 0) + (matches[0][3] ? parseFloat(matches[0][3])/3600 : 0);
                        if (matches[0][4].toUpperCase() === 'S') latVal *= -1;

                        let lngVal = parseFloat(matches[1][1]) + (matches[1][2] ? parseFloat(matches[1][2])/60 : 0) + (matches[1][3] ? parseFloat(matches[1][3])/3600 : 0);
                        if (matches[1][4].toUpperCase() === 'W') lngVal *= -1;

                        return { lat: latVal, lng: lngVal };
                    }
                } catch (e) {
                    console.error("DMS parse error", e);
                }
            }
            return null;
        }

        // Add pin to map and array
        function addPin(lat, lng, label = "") {
            const marker = L.marker([lat, lng]).addTo(map);
            markers.push({ marker, lat, lng, label });
            updatePointsSidebar();
        }

        // Update Sidebar UI with list of points
        function updatePointsSidebar() {
            const listContainer = document.getElementById('pointsList');
            listContainer.innerHTML = '';

            if (markers.length === 0) {
                listContainer.innerHTML = '<span class="text-gray-400 italic">Click on the map or add coordinates above.</span>';
                return;
            }

            markers.forEach((item, index) => {
                let displayCoord = "";
                if (currentFormat === 'wgs84') {
                    displayCoord = decimalToDMS(item.lat, item.lng);
                } else {
                    displayCoord = `${item.lat.toFixed(6)}, ${item.lng.toFixed(6)}`;
                }

                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white p-2 rounded border border-gray-200 shadow-sm";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-xs text-blue-600">Point #${index + 1}</span>
                        <p class="font-mono text-xs text-gray-700">${displayCoord}</p>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="focusMarker(${index})" class="bg-gray-100 hover:bg-gray-200 text-xs px-2 py-1 rounded">View</button>
                        <button onclick="removeMarker(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2 py-1 rounded">X</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function focusMarker(index) {
            const m = markers[index];
            map.setView([m.lat, m.lng], 15);
            m.marker.openPopup();
        }

        function removeMarker(index) {
            map.removeLayer(markers[index].marker);
            markers.splice(index, 1);
            updatePointsSidebar();
        }

        function clearAllPins() {
            markers.forEach(m => map.removeLayer(m.marker));
            markers = [];
            updatePointsSidebar();
        }

        // Plot manual input coordinates from textarea
        function plotManualCoordinates() {
            const text = document.getElementById('coordInput').value;
            const lines = text.split('\n');
            let firstCoord = null;

            lines.forEach(line => {
                const coord = parseCoordinateLine(line);
                if (coord) {
                    addPin(coord.lat, coord.lng);
                    if (!firstCoord) firstCoord = coord;
                }
            });

            if (firstCoord) {
                map.setView([firstCoord.lat, firstCoord.lng], 12);
            }
        }

        // Handle File Upload (.txt or .csv)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split('\n');
                let firstCoord = null;

                lines.forEach(line => {
                    const coord = parseCoordinateLine(line);
                    if (coord) {
                        addPin(coord.lat, coord.lng);
                        if (!firstCoord) firstCoord = coord;
                    }
                });

                if (firstCoord) {
                    map.setView([firstCoord.lat, firstCoord.lng], 12);
                }
            };
            reader.readAsText(file);
        }

        // Address Search using Nominatim API
        async function searchAddress() {
            const query = document.getElementById('addressSearchInput').value;
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 14);
                    addPin(lat, lon, data[0].display_name);
                } else {
                    alert("Address not found.");
                }
            } catch (error) {
                console.error("Geocoding error:", error);
                alert("Error searching address.");
            }
        }
    </script>
</body>
</html>
